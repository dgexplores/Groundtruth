name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pytest>=8,<9" "numpy>=1.26" "scikit-learn>=1.4,<2"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Retrieval benchmark
        run: python -m evals.runner

      - name: Regression gate
        run: python -m evals.regression_gate evals/baseline_report.json evals/reports/latest.json --metric recall_at_10
