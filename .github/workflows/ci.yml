name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Lint
        run: ruff check src evals tests

      - name: Typecheck
        run: mypy src evals

      - name: Dashboard syntax check
        run: node --check dashboard/app.js

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Retrieval benchmark
        run: python -m evals.runner

      - name: "Regression gate (headline: dense/semantic)"
        run: python -m evals.regression_gate evals/baseline_report.json evals/reports/latest.json --metric recall_at_10

      - name: "Regression gate (tfidf semantic)"
        run: python -m evals.regression_gate evals/baseline_report.json evals/reports/latest.json --metric tfidf_semantic_recall_at_10

      - name: QA smoke test (stub)
        run: python -m evals.runner --mode qa --out /tmp/qa_smoke.json
