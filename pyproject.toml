
[tool.poetry]
name = "groundtruth"
version = "0.1.0"
description = "Retrieval evaluation harness"
authors = ["Hermes Agent"]

[tool.poetry.dependencies]
python = "^3.10"
pytest = "^9.0.0"
numpy = "^2.0"
scikit-learn = "^1.4.0"
sentence-transformers = "^6.0"
openai = "^2.0"
google-genai = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
